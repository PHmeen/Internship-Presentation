<!-- สไลด์หน้า 2: ข้อมูลสถานประกอบการ - Full Screen Image + Floating Title -->
<div class="slide-page" style="padding: 0; overflow: hidden; position: relative; height: 100% !important; min-height: 100%;">


    <!-- Full Screen Background Image -->
    <img src="assets/rsp_original.png" alt="อุทยานวิทยาศาสตร์ภาคใต้ ม.อ."
        style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block;">

    <!-- Dark gradient at bottom for text legibility -->
    <div style="position: absolute; inset: 0; background: linear-gradient(to bottom, rgba(5,8,17,0.5) 0%, transparent 35%, transparent 55%, rgba(5,8,17,0.85) 100%); pointer-events: none;"></div>

    <!-- Floating Title at bottom-left -->
    <div style="position: absolute; bottom: clamp(24px, 5vh, 42px); left: clamp(24px, 5vw, 48px); z-index: 2;">
        <div style="font-family: var(--font-mono); font-size: clamp(0.65rem, 1.2vw, 0.78rem); color: var(--color-accent);
                    letter-spacing: 0.15em; text-transform: uppercase; margin-bottom: 8px; font-weight: 600;
                    text-shadow: 0 2px 8px rgba(0,0,0,0.8);">
            สถานประกอบการ · Workplace
        </div>
        <h2 class="slide-title" style="margin: 0; color: #ffffff; text-shadow: 0 2px 16px rgba(0,0,0,0.9);">
            อุทยานวิทยาศาสตร์<span> มหาวิทยาลัยสงขลานครินทร์</span>
        </h2>
    </div>

</div>
