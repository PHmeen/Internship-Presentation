<!-- สไลด์หน้า 9: ภาพกิจกรรมและการสนับสนุนงาน -->
<div class="slide-page" style="padding: clamp(12px, 2.5vw, 28px); justify-content: center; align-items: center; overflow-y: auto; position: relative;">

    <!-- Background Ambient Glow -->
    <div style="position:absolute; inset:0; background:radial-gradient(circle at 50% 50%, rgba(0,163,255,0.04) 0%, transparent 65%); pointer-events:none; z-index:0;"></div>

    <style>
        /* ---- Activity Grid ---- */
        .activity-grid {
            width: 100%;
            max-width: 1100px;
            z-index: 1;
            flex: 1;
            min-height: 0;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: clamp(10px, 2vw, 18px);
            align-items: stretch;
        }

        /* Tablet: 2 columns */
        @media (max-width: 900px) {
            .activity-grid {
                grid-template-columns: repeat(2, 1fr);
                flex: none;
            }
        }

        /* Mobile: 1 column */
        @media (max-width: 520px) {
            .activity-grid {
                grid-template-columns: 1fr;
                flex: none;
            }
        }

        /* ---- Activity Card ---- */
        .activity-card {
            display: flex;
            flex-direction: column;
            border-radius: 14px;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.06);
            box-shadow: 0 12px 30px rgba(0,0,0,0.5);
            transition: all 0.35s cubic-bezier(0.16,1,0.3,1);
            cursor: zoom-in;
            position: relative;
        }

        .activity-card:hover {
            transform: translateY(-4px);
            border-color: rgba(0,163,255,0.3);
            box-shadow: 0 20px 45px rgba(0,163,255,0.1);
        }

        /* ---- Photo frame ---- */
        .activity-photo {
            flex: 1;
            min-height: 0;
            /* aspect-ratio as fallback for browsers that need it */
            aspect-ratio: 4/3;
            overflow: hidden;
            background: #04070e;
        }

        /* On desktop: let flex fill, don't enforce aspect-ratio */
        @media (min-width: 901px) {
            .activity-photo {
                aspect-ratio: unset;
            }
        }

        .activity-photo img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: transform 0.5s ease;
        }

        .activity-card:hover .activity-photo img {
            transform: scale(1.05);
        }

        /* ---- Caption bar ---- */
        .activity-caption {
            padding: clamp(10px, 1.6vw, 16px) clamp(12px, 2vw, 20px);
            background: linear-gradient(135deg, rgba(13,20,38,0.97) 0%, rgba(8,12,24,0.99) 100%);
            flex-shrink: 0;
            border-top: 1px solid rgba(255,255,255,0.06);
        }

        .activity-badge {
            font-family: var(--font-mono);
            font-size: 0.6rem;
            color: var(--color-accent);
            font-weight: 700;
            letter-spacing: 0.1em;
            margin-bottom: 4px;
        }

        .activity-name {
            font-family: var(--font-display);
            font-size: clamp(0.88rem, 1.8vw, 1.15rem);
            font-weight: 700;
            color: #fff;
            line-height: 1.3;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* Smaller caption on tablet/mobile */
        @media (max-width: 900px) {
            .activity-name { font-size: clamp(0.9rem, 2.5vw, 1.05rem); white-space: normal; }
        }
    </style>

    <!-- ส่วนหัว -->
    <div style="width:100%; max-width:1100px; text-align:left; margin-bottom:clamp(10px, 2vw, 20px); z-index:1; flex-shrink:0;">
        <div style="font-family:var(--font-mono); font-size:0.72rem; color:var(--color-accent); letter-spacing:0.2em; text-transform:uppercase; margin-bottom:4px; font-weight:600;">
            Internship Activities &amp; Community Support
        </div>
        <h2 class="slide-title" style="margin-bottom:0;">ภาพกิจกรรมและ<span>ระหว่างฝึกงาน</span></h2>
    </div>

    <!-- Grid ภาพ 3 คอลัมน์ -->
    <div class="activity-grid">

        <!-- กิจกรรมที่ 1 -->
        <div class="activity-card">
            <div class="activity-photo">
                <img src="assets/activity/AIMEEN.jpg" alt="Al Skills Training"
                     onerror="this.parentElement.style.display='flex'; this.parentElement.style.alignItems='center'; this.parentElement.style.justifyContent='center'; this.parentElement.style.background='radial-gradient(circle,#0e172a,#060b13)'; this.style.display='none';">
            </div>
            <div class="activity-caption">
                <div class="activity-badge">ACTIVITY 01</div>
                <div class="activity-name">Al Skills Training</div>
            </div>
        </div>

        <!-- กิจกรรมที่ 2 -->
        <div class="activity-card">
            <div class="activity-photo">
                <img src="assets/activity/live.jpg" alt="ช้อปมันส์สนั่น LIVE"
                     onerror="this.parentElement.style.display='flex'; this.parentElement.style.alignItems='center'; this.parentElement.style.justifyContent='center'; this.parentElement.style.background='radial-gradient(circle,#0e172a,#060b13)'; this.style.display='none';">
            </div>
            <div class="activity-caption">
                <div class="activity-badge">ACTIVITY 02</div>
                <div class="activity-name">ช้อปมันส์สนั่น LIVE</div>
            </div>
        </div>

        <!-- กิจกรรมที่ 3 -->
        <div class="activity-card">
            <div class="activity-photo">
                <img src="assets/activity/ASEAN.jpg" alt="PSU-AUN Summer Camp 2026"
                     onerror="this.parentElement.style.display='flex'; this.parentElement.style.alignItems='center'; this.parentElement.style.justifyContent='center'; this.parentElement.style.background='radial-gradient(circle,#0e172a,#060b13)'; this.style.display='none';">
            </div>
            <div class="activity-caption">
                <div class="activity-badge">ACTIVITY 03</div>
                <div class="activity-name">PSU-AUN Summer Camp 2026</div>
            </div>
        </div>

    </div>
</div>
