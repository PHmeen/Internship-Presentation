<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="description" content="สรุปการฝึกงานสหกิจศึกษา - อุทยานวิทยาศาสตร์ ม.อ. โดยนายพาทิศ หนูดำ">
    <title>สหกิจศึกษา - สรุปการฝึกงาน</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono&family=Outfit:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <!-- [1] กรอบคลุมโครงสร้างหน้าหลักทั้งหมด -->
    <div class="presentation-shell">

        <!-- Sidebar Overlay (mobile backdrop) -->
        <div class="sidebar-overlay" id="sidebar-overlay"></div>

        <!-- [2] แถบเมนูด้านซ้าย -->
        <aside class="app-sidebar" id="app-sidebar">
            <div class="sidebar-logo">
                <img src="assets/logo/RSPSOUTH.png" alt="RSP South Logo">
            </div>

            <nav class="sidebar-menu">
                <ul id="sidebar-list">
                    <li data-index="0" class="active"><span class="label">🏠 หน้าแรก</span></li>
                    <li data-index="1"><span class="label">🏢 ข้อมูลองค์กร</span></li>
                    <li data-index="2"><span class="label">💼 ตำแหน่งและลักษณะงาน</span></li>
                    <li data-index="3"><span class="label">📋 บทบาทและหน้าที่</span></li>
                    <li data-index="4"><span class="label">🔧 ปัญหาและการแก้ไข</span></li>
                    <li data-index="5"><span class="label">📚 ทักษะและสิ่งที่ได้รับ</span></li>
                    <li data-index="6"><span class="label">📸 ภาพกิจกรรม</span></li>
                    <li data-index="7"><span class="label">🎓 บทสรุป</span></li>
                </ul>
            </nav>

            <div class="sidebar-footer">
                <a href="./export.html" target="_blank" class="export-link">
                    <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4a2 2 0 00-2-2H9a2 2 0 00-2 2v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z" />
                    </svg>
                    <span>บันทึกเป็น PDF</span>
                </a>
                <span class="mono-label" style="font-size: 0.7rem;">RSP South</span>
            </div>
        </aside>

        <!-- [3] พื้นที่แสดงผลสไลด์ -->
        <div class="main-display">

            <!-- แถบด้านบน -->
            <header class="app-header">
                <!-- Mobile sidebar toggle -->
                <button class="sidebar-toggle" id="sidebar-toggle" aria-label="เปิดเมนู">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16" />
                    </svg>
                </button>

                <div class="topic-indicator">
                    <span class="mono-label" id="current-section-title">หน้าแรก</span>
                </div>

                <div class="customizer-pill">
                    <span class="mono-label" style="font-size: 0.65rem; margin-right: 2px;">สีธีม:</span>
                    <div class="color-picker-wrapper">
                        <button class="color-dot active" data-color="#00a3ff" style="background-color: #00a3ff;" title="Electric Blue"></button>
                        <button class="color-dot" data-color="#10b981" style="background-color: #10b981;" title="Tech Emerald"></button>
                        <button class="color-dot" data-color="#a855f7" style="background-color: #a855f7;" title="Cyber Purple"></button>
                        <button class="color-dot" data-color="#f59e0b" style="background-color: #f59e0b;" title="Amber Gold"></button>
                    </div>
                </div>

                <div class="slide-indicator">
                    <span id="current-slide-num">01</span><span class="divider">/</span><span id="total-slides-num">10</span>
                </div>
            </header>

            <!-- Slide Viewport -->
            <main id="presentation-container" class="presentation-viewport">
                <div id="slide-wrapper" class="slide-content-wrapper"></div>
            </main>

            <!-- Footer Controls -->
            <footer class="app-footer">
                <div class="navigation-controls">
                    <button id="prev-btn" class="nav-btn" aria-label="Previous Slide">
                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7" />
                        </svg>
                    </button>
                    <button id="next-btn" class="nav-btn" aria-label="Next Slide">
                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7" />
                        </svg>
                    </button>
                </div>

                <div class="progress-container">
                    <div id="progress-bar" class="progress-bar"></div>
                </div>

                <div class="keyboard-tip">
                    <span class="key-badge">←</span>
                    <span class="key-badge">→</span>
                    <span class="tip-text">เปลี่ยนสไลด์</span>
                </div>
            </footer>
        </div>
    </div>

    <!-- Lightbox Modal -->
    <div id="lightbox-modal" class="lightbox">
        <span class="lightbox-close">&times;</span>
        <img class="lightbox-content" id="lightbox-img" alt="Zoomed Screenshot">
        <div id="lightbox-caption" class="lightbox-caption"></div>
    </div>

    <script src="js/app.js"></script>
</body>

</html>
