<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>สหกิจศึกษา - สรุปการฝึกงาน</title>
    <!-- โหลดชุดฟอนต์จาก Google Fonts: Outfit (หัวข้อ), Inter (เนื้อความ), JetBrains Mono (โค้ด/ตัวเลข) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono&family=Outfit:wght@500;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <!-- [1] กรอบคลุมโครงสร้างหน้าหลักทั้งหมด (Shell Wrapper) -->
    <div class="presentation-shell">

        <!-- [2] แถบเมนูด้านซ้าย (Sidebar Navigation Index) -->
        <aside class="app-sidebar">
            <!-- โลโก้/หัวข้อด้านบนสุดของแถบเมนู -->
            <div class="sidebar-logo">
                <span class="accent-dot animate-pulse"></span>
                <span class="logo-title">INTERN SHOWCASE</span>
            </div>

            <!-- รายการดัชนีหัวข้อสไลด์ (กดคลิกเพื่อเลื่อนเปลี่ยนหน้าได้ทันที) -->
            <nav class="sidebar-menu">
                <ul id="sidebar-list">
                    <!-- รายการเมนูแต่ละข้อตรงกับสไลด์ในอาร์เรย์ slides[] ใน app.js -->
                    <li data-index="0" class="active"><span class="label">🏠 หน้าปก</span></li>
                    <li data-index="1"><span class="label">🏢 ข้อมูลองค์กร</span></li>
                    <li data-index="2"><span class="label">💼 ตำแหน่งและลักษณะงาน</span></li>
                    <li data-index="3"><span class="label">📋 บทบาทและหน้าที่</span></li>
                    <li data-index="4"><span class="label">💡 โครงการเด่น</span></li>
                    <li data-index="5"><span class="label">🔧 ปัญหาและการแก้ไข</span></li>
                    <li data-index="6"><span class="label">📚 ทักษะและสิ่งที่ได้รับ</span></li>
                    <li data-index="7"><span class="label">💬 ข้อเสนอแนะ</span></li>
                    <li data-index="8"><span class="label">🎓 บทสรุป</span></li>
                </ul>
            </nav>

            <!-- ส่วนขอบล่างระบุเวอร์ชันระบบแถบซ้าย -->
            <div class="sidebar-footer">
                <span class="mono-label">RSP South</span>
            </div>
        </aside>

        <!-- [3] พื้นที่แสดงผลสไลด์และแถบนำทางฝั่งขวา (Main Display Area) -->
        <div class="main-display">

            <!-- แถบด้านบนแสดงชื่อบทเรียนและจำนวนหน้า (Header Bar) -->
            <header class="app-header">
                <!-- ตัวบอกชื่อหัวเรื่องการพรีเซนต์ของสไลด์ที่กำลังแสดงอยู่ -->
                <div class="topic-indicator">
                    <span class="mono-label" id="current-section-title">หน้าแรก</span>
                </div>

                <!-- ชุดปุ่มจุดเปลี่ยนโทนสีธีมแบบโต้ตอบ (Theme Accent Customizer Pill) -->
                <div class="customizer-pill">
                    <span class="mono-label" style="font-size: 0.7rem; margin-right: 4px;">ปรับสีธีม:</span>
                    <div class="color-picker-wrapper">
                        <button class="color-dot active" data-color="#00a3ff" style="background-color: #00a3ff;"
                            title="Electric Blue (ฟ้าสว่าง)"></button>
                        <button class="color-dot" data-color="#10b981" style="background-color: #10b981;"
                            title="Tech Emerald (เขียวเทคโนโลยี)"></button>
                        <button class="color-dot" data-color="#a855f7" style="background-color: #a855f7;"
                            title="Cyber Purple (ม่วงไซเบอร์)"></button>
                        <button class="color-dot" data-color="#f59e0b" style="background-color: #f59e0b;"
                            title="Amber Gold (ทองสว่าง)"></button>
                    </div>
                </div>

                <!-- เลขสไลด์ปัจจุบัน / จำนวนหน้าทั้งหมด -->
                <div class="slide-indicator">
                    <span id="current-slide-num">01</span><span class="divider">/</span><span
                        id="total-slides-num">10</span>
                </div>
            </header>

            <!-- พื้นที่สำหรับโหลดสไลด์จากโฟลเดอร์ภายนอกเข้ามาแทรกแสดงผล (Slide Viewport) -->
            <main id="presentation-container" class="presentation-viewport">
                <div id="slide-wrapper" class="slide-content-wrapper"></div>
            </main>

            <!-- แถบด้านล่างสำหรับควบคุมการเดินหน้าย้อนกลับและแสดงความก้าวหน้า (Footer Bar) -->
            <footer class="app-footer">
                <!-- ปุ่มนำทางเดินหน้า/ย้อนกลับ -->
                <div class="navigation-controls">
                    <button id="prev-btn" class="nav-btn" aria-label="Previous Slide">
                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="none" viewBox="0 0 24 24"
                            stroke="currentColor" stroke-width="2.5">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7" />
                        </svg>
                    </button>
                    <button id="next-btn" class="nav-btn" aria-label="Next Slide">
                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="none" viewBox="0 0 24 24"
                            stroke="currentColor" stroke-width="2.5">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7" />
                        </svg>
                    </button>
                </div>

                <!-- แถบความก้าวหน้า (Progress Bar) -->
                <div class="progress-container">
                    <div id="progress-bar" class="progress-bar"></div>
                </div>

                <!-- ป้ายแนะนำปุ่มคีย์บอร์ดสำหรับการนำเสนอผลงาน -->
                <div class="keyboard-tip">
                    <span class="key-badge">←</span>
                    <span class="key-badge">→</span>
                    <span class="tip-text">เปลี่ยนสไลด์</span>
                </div>
            </footer>
        </div>
    </div>

    <!-- Lightbox Modal for zooming in on screenshots -->
    <div id="lightbox-modal" class="lightbox">
        <span class="lightbox-close">&times;</span>
        <img class="lightbox-content" id="lightbox-img" alt="Zoomed Screenshot">
        <div id="lightbox-caption" class="lightbox-caption"></div>
    </div>

    <!-- ส่วนโหลดเอ็นจิ้นควบคุมระบบทั้งหมด -->
    <script src="js/app.js"></script>
</body>

</html>
